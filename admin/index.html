<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Leads | Top Car Motor Sport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --blue:#0052CC; --blue-dark:#003f9e; --bg:#f4f6fa; --ink:#0d1117; --muted:#5b6475; --line:#dde3ee; --green:#25D366; --red:#dc143c; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:'Roboto', sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }
  h1,h2,h3{ font-family:'Rajdhani', sans-serif; text-transform:uppercase; }
  button{ font:inherit; cursor:pointer; }
  [hidden]{ display:none !important; }

  .login-wrap{ min-height:100vh; display:grid; place-items:center; padding:20px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:28px; box-shadow:0 14px 40px rgba(0,82,204,0.10); }
  .login-card{ width:100%; max-width:380px; }
  .login-card h1{ font-size:28px; margin-bottom:4px; }
  .login-card p{ color:var(--muted); font-size:14px; margin-bottom:18px; }
  label{ display:block; font-family:'Rajdhani', sans-serif; font-weight:700; font-size:14px; margin:12px 0 5px; }
  input[type=email], input[type=password], input[type=search], select{
    width:100%; padding:11px 12px; border:1px solid #c9d3e6; border-radius:8px; font:inherit; background:#fff;
  }
  input:focus, select:focus{ outline:2px solid var(--blue); outline-offset:1px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 18px; border:none; border-radius:8px; font-family:'Rajdhani', sans-serif; font-weight:700; letter-spacing:.5px; text-transform:uppercase; text-decoration:none; font-size:14px; }
  .btn-primary{ background:var(--blue); color:#fff; width:100%; margin-top:18px; padding:13px; }
  .btn-primary:hover{ background:var(--blue-dark); }
  .btn-ghost{ background:#fff; color:var(--ink); border:1px solid var(--line); }
  .btn-ghost:hover{ border-color:var(--blue); color:var(--blue); }
  .msg{ font-size:13px; margin-top:12px; color:var(--red); }
  .setup{ background:#fff7e6; border:1px solid #f3d9a4; padding:12px; border-radius:8px; font-size:13px; margin-top:14px; }

  header.bar{ background:#fff; border-bottom:1px solid var(--line); padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
  header.bar h1{ font-size:22px; }
  header.bar .who{ color:var(--muted); font-size:13px; margin-right:10px; }
  main{ max-width:1100px; margin:0 auto; padding:20px; }
  .stats{ display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin-bottom:16px; }
  .stat{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .stat b{ display:block; font-family:'Rajdhani', sans-serif; font-size:28px; }
  .stat span{ color:var(--muted); font-size:13px; }
  .tools{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .tools input[type=search]{ flex:1 1 220px; }
  .tools select{ width:auto; }
  .lead{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:10px; display:grid; grid-template-columns:1.1fr 2fr auto; gap:14px; align-items:start; }
  .lead.is-new{ border-left:4px solid var(--blue); }
  .lead h3{ font-size:20px; text-transform:none; }
  .lead .when{ color:var(--muted); font-size:12px; margin-top:2px; }
  .lead .phone{ margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
  .chip{ display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:999px; font-size:13px; font-weight:500; text-decoration:none; border:1px solid var(--line); color:var(--ink); }
  .chip.wa{ background:var(--green); border-color:var(--green); color:#fff; }
  .chip.call{ background:var(--blue); border-color:var(--blue); color:#fff; }
  .lead .text{ white-space:pre-wrap; word-break:break-word; font-size:15px; }
  .lead .actions{ display:flex; flex-direction:column; gap:8px; min-width:140px; }
  .del{ background:none; border:none; color:var(--red); font-size:12px; text-align:left; padding:0; }
  .empty{ text-align:center; color:var(--muted); padding:40px 10px; }
  .tools.dates{ align-items:center; }
  .tools.dates select, .tools.dates input[type=date]{ width:auto; }
  .dl{ display:flex; align-items:center; gap:6px; margin:0; font-family:'Roboto', sans-serif; font-weight:500; font-size:13px; color:var(--muted); }
  .dl input{ padding:9px 10px; border:1px solid #c9d3e6; border-radius:8px; font:inherit; }
  .count{ margin-left:auto; color:var(--muted); font-size:13px; }
  .lead{ cursor:pointer; transition:box-shadow .2s, border-color .2s; }
  .lead:hover{ border-color:var(--blue); box-shadow:0 6px 20px rgba(0,82,204,0.10); }
  .lead .text{ display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .lead .more{ display:block; margin-top:6px; color:var(--blue); font-size:12px; font-weight:700; }
  .overlay{ position:fixed; inset:0; background:rgba(8,14,28,0.6); display:flex; align-items:center; justify-content:center; padding:16px; z-index:20; }
  .modal{ background:#fff; border-radius:16px; width:100%; max-width:560px; max-height:92vh; overflow:auto; padding:26px; position:relative; box-shadow:0 24px 70px rgba(0,0,0,0.35); }
  .modal h2{ font-size:28px; text-transform:none; padding-right:34px; }
  .modal h4{ font-family:'Rajdhani', sans-serif; text-transform:uppercase; font-size:14px; letter-spacing:.8px; color:var(--muted); margin:20px 0 8px; }
  .modal .x{ position:absolute; top:12px; right:14px; background:none; border:none; font-size:30px; line-height:1; color:var(--muted); }
  .m-when{ color:var(--muted); font-size:13px; margin-top:2px; }
  .m-contact{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .m-contact .chip{ padding:10px 16px; font-size:15px; }
  .m-msg{ background:#f4f7fd; border:1px solid var(--line); border-left:4px solid var(--blue); border-radius:10px; padding:16px; font-size:17px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
  .m-foot{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:20px; }
  .m-status{ display:flex; align-items:center; gap:8px; margin:0; font-size:14px; }
  .m-status select{ width:auto; }
  .m-foot .del{ margin-left:auto; }
  .m-src{ margin-top:16px; color:var(--muted); font-size:11px; word-break:break-all; }
  @media (max-width:760px){
    .count{ margin-left:0; width:100%; }
    .stats{ grid-template-columns:repeat(2, 1fr); }
    .lead{ grid-template-columns:1fr; }
    .lead .actions{ flex-direction:row; align-items:center; justify-content:space-between; }
  }
</style>
</head>
<body>

<div class="login-wrap" id="loginView">
  <div class="card login-card">
    <h1>Leads</h1>
    <p>Top Car Motor Sport &middot; owner access</p>
    <form id="loginForm">
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button class="btn btn-primary" type="submit">Sign in</button>
      <p class="msg" id="loginMsg" hidden></p>
    </form>
    <div class="setup" id="setupNote" hidden>Not connected yet: fill in <b>leads-config.js</b> with the Supabase URL and anon key.</div>
  </div>
</div>

<div id="appView" hidden>
  <header class="bar">
    <h1>Leads</h1>
    <div>
      <span class="who" id="who"></span>
      <button class="btn btn-ghost" id="refreshBtn" type="button">Refresh</button>
      <button class="btn btn-ghost" id="csvBtn" type="button">Export CSV</button>
      <button class="btn btn-ghost" id="logoutBtn" type="button">Sign out</button>
    </div>
  </header>
  <main>
    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><span>Total leads</span></div>
      <div class="stat"><b id="sNew">0</b><span>New</span></div>
      <div class="stat"><b id="sContacted">0</b><span>Contacted</span></div>
      <div class="stat"><b id="sClosed">0</b><span>Closed</span></div>
    </div>
    <div class="tools">
      <input type="search" id="search" placeholder="Search name, phone or message">
      <select id="filter">
        <option value="">All statuses</option>
        <option value="new">New</option>
        <option value="contacted">Contacted</option>
        <option value="closed">Closed</option>
      </select>
    </div>
    <div class="tools dates">
      <select id="preset" aria-label="Period">
        <option value="">All dates</option>
        <option value="today">Today</option>
        <option value="yesterday">Yesterday</option>
        <option value="7">Last 7 days</option>
        <option value="30">Last 30 days</option>
        <option value="month">This month</option>
        <option value="custom">Custom range</option>
      </select>
      <label class="dl">From <input type="date" id="dFrom"></label>
      <label class="dl">To <input type="date" id="dTo"></label>
      <button class="btn btn-ghost" id="clearFilters" type="button">Clear filters</button>
      <span class="count" id="resultCount"></span>
    </div>
    <div id="list"></div>
  </main>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mName">
    <button class="x" id="mClose" type="button" aria-label="Close">&times;</button>
    <h2 id="mName"></h2>
    <div class="m-when" id="mWhen"></div>
    <div class="m-contact" id="mContact"></div>
    <h4>Car &amp; problem described by the customer</h4>
    <div class="m-msg" id="mMsg"></div>
    <div class="m-foot">
      <label class="m-status">Status
        <select id="mStatus">
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="closed">Closed</option>
        </select>
      </label>
      <button class="btn btn-ghost" id="mCopy" type="button">Copy details</button>
      <button class="del" id="mDelete" type="button">Delete lead</button>
    </div>
    <div class="m-src" id="mSrc"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/leads-config.js"></script>
<script>
(function(){
  const cfg = window.LEADS_CONFIG || {};
  const $ = id => document.getElementById(id);
  let db = null, leads = [];

  if (!cfg.url || !cfg.anonKey) { $('setupNote').hidden = false; }
  else { db = supabase.createClient(cfg.url, cfg.anonKey); init(); }

  function showApp(user){
    $('loginView').hidden = true; $('appView').hidden = false;
    $('who').textContent = user.email;
    load();
  }
  function showLogin(){ $('appView').hidden = true; $('loginView').hidden = false; }

  async function init(){
    const { data } = await db.auth.getSession();
    if (data.session) showApp(data.session.user); else showLogin();
  }

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    if (!db) return;
    const msg = $('loginMsg'); msg.hidden = true;
    const { data, error } = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
    if (error) { msg.textContent = 'Wrong e-mail or password.'; msg.hidden = false; return; }
    $('password').value = '';
    showApp(data.user);
  });

  $('logoutBtn').addEventListener('click', async () => { await db.auth.signOut(); leads = []; showLogin(); });
  $('refreshBtn').addEventListener('click', load);
  $('search').addEventListener('input', render);
  $('filter').addEventListener('change', render);

  // ---- date filter ----
  const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  function applyPreset(){
    const p = $('preset').value, now = new Date(), day = n => { const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - n); return ymd(d); };
    if (p === 'custom') return render();
    if (!p) { $('dFrom').value = ''; $('dTo').value = ''; }
    else if (p === 'today') { $('dFrom').value = day(0); $('dTo').value = day(0); }
    else if (p === 'yesterday') { $('dFrom').value = day(1); $('dTo').value = day(1); }
    else if (p === '7') { $('dFrom').value = day(6); $('dTo').value = day(0); }
    else if (p === '30') { $('dFrom').value = day(29); $('dTo').value = day(0); }
    else if (p === 'month') { $('dFrom').value = ymd(new Date(now.getFullYear(), now.getMonth(), 1)); $('dTo').value = day(0); }
    render();
  }
  $('preset').addEventListener('change', applyPreset);
  ['dFrom', 'dTo'].forEach(id => $(id).addEventListener('change', () => { $('preset').value = ($('dFrom').value || $('dTo').value) ? 'custom' : ''; render(); }));
  $('clearFilters').addEventListener('click', () => { $('search').value = ''; $('filter').value = ''; $('preset').value = ''; $('dFrom').value = ''; $('dTo').value = ''; render(); });

  function inRange(l){
    const t = new Date(l.created_at).getTime(), from = $('dFrom').value, to = $('dTo').value;
    if (from && t < new Date(from + 'T00:00:00').getTime()) return false;
    if (to && t > new Date(to + 'T23:59:59.999').getTime()) return false;
    return true;
  }
  let shown = [];

  async function load(){
    const { data, error } = await db.from('leads').select('*').order('created_at', { ascending:false }).limit(1000);
    if (error) { $('list').innerHTML = ''; const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Could not load leads (' + error.message + ').'; $('list').appendChild(d); return; }
    leads = data; render();
  }

  function digits(p){ let d = String(p).replace(/\D/g, ''); if (d.length === 10) d = '1' + d; return d; }

  function render(){
    const q = $('search').value.trim().toLowerCase(), f = $('filter').value;
    $('sTotal').textContent = leads.length;
    ['new','contacted','closed'].forEach(s => { $('s' + s[0].toUpperCase() + s.slice(1)).textContent = leads.filter(l => l.status === s).length; });

    const rows = leads.filter(l => (!f || l.status === f) && inRange(l) && (!q || (l.name + ' ' + l.phone + ' ' + l.message).toLowerCase().includes(q)));
    shown = rows;
    $('resultCount').textContent = rows.length === leads.length ? '' : rows.length + ' of ' + leads.length + ' leads';
    const list = $('list'); list.textContent = '';
    if (!rows.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = leads.length ? 'No leads match this filter.' : 'No leads yet. They will appear here as soon as someone fills the form.'; list.appendChild(d); return; }

    rows.forEach(l => {
      const el = document.createElement('div'); el.className = 'lead' + (l.status === 'new' ? ' is-new' : '');

      const c1 = document.createElement('div');
      const h = document.createElement('h3'); h.textContent = l.name;
      const when = document.createElement('div'); when.className = 'when'; when.textContent = new Date(l.created_at).toLocaleString('en-US', { dateStyle:'medium', timeStyle:'short' });
      const ph = document.createElement('div'); ph.className = 'phone';
      const call = document.createElement('a'); call.className = 'chip call'; call.href = 'tel:+' + digits(l.phone); call.textContent = l.phone;
      const wa = document.createElement('a'); wa.className = 'chip wa'; wa.target = '_blank'; wa.rel = 'noopener';
      wa.href = 'https://wa.me/' + digits(l.phone) + '?text=' + encodeURIComponent('Hi ' + l.name + ', this is Top Car Motor Sport about your quote request.');
      wa.textContent = 'WhatsApp';
      ph.append(call, wa); c1.append(h, when, ph);

      const c2 = document.createElement('div');
      const txt = document.createElement('div'); txt.className = 'text'; txt.textContent = l.message;
      const more = document.createElement('span'); more.className = 'more'; more.textContent = 'Click to see full details';
      c2.append(txt, more);
      el.tabIndex = 0; el.setAttribute('role', 'button');
      el.addEventListener('click', e => { if (e.target.closest('a, select, button')) return; openLead(l); });
      el.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === el) { e.preventDefault(); openLead(l); } });

      const c3 = document.createElement('div'); c3.className = 'actions';
      const sel = document.createElement('select');
      [['new','New'],['contacted','Contacted'],['closed','Closed']].forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; if (l.status === v) o.selected = true; sel.appendChild(o); });
      sel.addEventListener('change', async () => {
        const { error } = await db.from('leads').update({ status: sel.value }).eq('id', l.id);
        if (error) { alert('Could not update: ' + error.message); sel.value = l.status; return; }
        l.status = sel.value; render();
      });
      const del = document.createElement('button'); del.className = 'del'; del.type = 'button'; del.textContent = 'Delete lead';
      del.addEventListener('click', async () => {
        if (!confirm('Delete the lead from ' + l.name + '? This cannot be undone.')) return;
        const { error } = await db.from('leads').delete().eq('id', l.id);
        if (error) { alert('Could not delete: ' + error.message); return; }
        leads = leads.filter(x => x.id !== l.id); render();
      });
      c3.append(sel, del);

      el.append(c1, c2, c3); list.appendChild(el);
    });
  }

  // ---- lead detail window ----
  let current = null;
  function openLead(l){
    current = l;
    $('mName').textContent = l.name;
    $('mWhen').textContent = 'Received ' + new Date(l.created_at).toLocaleString('en-US', { dateStyle:'full', timeStyle:'short' });
    const box = $('mContact'); box.textContent = '';
    const call = document.createElement('a'); call.className = 'chip call'; call.href = 'tel:+' + digits(l.phone); call.textContent = 'Call ' + l.phone;
    const wa = document.createElement('a'); wa.className = 'chip wa'; wa.target = '_blank'; wa.rel = 'noopener';
    wa.href = 'https://wa.me/' + digits(l.phone) + '?text=' + encodeURIComponent('Hi ' + l.name + ', this is Top Car Motor Sport about your quote request.');
    wa.textContent = 'WhatsApp';
    box.append(call, wa);
    $('mMsg').textContent = l.message;
    $('mStatus').value = l.status;
    $('mSrc').textContent = l.source ? 'Sent from: ' + l.source : '';
    $('overlay').hidden = false;
    $('mClose').focus();
  }
  function closeLead(){ $('overlay').hidden = true; current = null; }
  $('mClose').addEventListener('click', closeLead);
  $('overlay').addEventListener('click', e => { if (e.target === $('overlay')) closeLead(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('overlay').hidden) closeLead(); });
  $('mStatus').addEventListener('change', async () => {
    if (!current) return;
    const { error } = await db.from('leads').update({ status: $('mStatus').value }).eq('id', current.id);
    if (error) { alert('Could not update: ' + error.message); $('mStatus').value = current.status; return; }
    current.status = $('mStatus').value; render();
  });
  $('mDelete').addEventListener('click', async () => {
    if (!current || !confirm('Delete the lead from ' + current.name + '? This cannot be undone.')) return;
    const { error } = await db.from('leads').delete().eq('id', current.id);
    if (error) { alert('Could not delete: ' + error.message); return; }
    leads = leads.filter(x => x.id !== current.id); closeLead(); render();
  });
  $('mCopy').addEventListener('click', async () => {
    if (!current) return;
    const t = 'Name: ' + current.name + '\nPhone: ' + current.phone + '\nReceived: ' + new Date(current.created_at).toLocaleString('en-US') + '\n\nCar & problem:\n' + current.message;
    try { await navigator.clipboard.writeText(t); $('mCopy').textContent = 'Copied!'; setTimeout(() => { $('mCopy').textContent = 'Copy details'; }, 1500); } catch (e) { alert(t); }
  });

  $('csvBtn').addEventListener('click', () => {
    const esc = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const safe = v => /^[=+\-@]/.test(String(v)) ? "'" + v : v;
    const rows = [['Date','Name','Phone','Message','Status']].concat(shown.map(l => [l.created_at, safe(l.name), safe(l.phone), safe(l.message), l.status]));
    const blob = new Blob([rows.map(r => r.map(esc).join(',')).join('\n')], { type:'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'top-car-leads.csv'; a.click(); URL.revokeObjectURL(a.href);
  });
})();
</script>
</body>
</html>
